name: Reproduce and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/reproduce.py examples
      - run: python scripts/reproduce.py analysis --refit
      - run: python scripts/proof_map.py --check
      - run: python scripts/check_package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-reproduction
          path: |
            build/*.log
            build/reproduction.json
            papers/identification/analysis/*.json
            papers/identification/analysis/*.csv

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
      - run: lake exe cache get
        working-directory: lean
      - run: lake build
        working-directory: lean
      - run: python3 scripts/proof_map.py --check --lean
